name: Publish Dorhamisaz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dorhamisaz-api.mohammadnabio2476.workers.dev' }}
      SITE_BASE_PATH: /dorhamisaz-mt/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify API and database before publication
        run: node --input-type=module -e "const r=await fetch(process.env.VITE_API_BASE_URL.replace(/\/$/,'')+'/api/health');if(!r.ok||!(await r.json()).ok)throw new Error('API or database is not ready')"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
